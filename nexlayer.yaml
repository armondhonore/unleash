application:
  name: unleash
  pods:
  - name: app
    image: unleashorg/unleash-server:latest
    path: /
    servicePorts:
    - 4242
    vars:
      DATABASE_URL: "postgres://unleash:unleash@postgres.pod:5432/unleash"
      DATABASE_SSL: "false"
      LOG_LEVEL: warn
  - name: postgres
    image: postgres:16-alpine
    servicePorts:
    - 5432
    vars:
      POSTGRES_DB: unleash
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: unleash
    volumes:
    - name: unleash-db
      mountPath: /var/lib/postgresql/data
      size: 5Gi
